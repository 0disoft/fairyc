<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1458" viewBox="0 0 1120 1458" role="img" aria-labelledby="chart-f742307f-title chart-f742307f-desc"><title id="chart-f742307f-title">Build footprints after 20 source edits</title><desc id="chart-f742307f-desc">Build footprints sum logical file lengths after each command in disjoint output/cache roots. Toolchain installations are inventoried separately; transient peak disk usage is not measured. Cold means empty experiment caches, not OS page caches. Timings include driver startup. C directly rebuilds all sources, including no-op. Development profiles have different debug/safety defaults.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="32.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#16283c">Build footprints after 20 source edits</text><text x="32.00" y="69.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53677c">2026-10-20T12:14:42Z  |  windows/amd64  |  commit ec446d2dfd  |  1 sequence(s) per config</text><text x="32.00" y="92.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53677c">Retained logical bytes; toolchain installs and transient peaks excluded. Each configuration has isolated caches.</text><text x="32.00" y="115.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#53677c">fairy: checkout ec446d2dfd63307ca7d9c884ca93b518570ff42c</text><text x="32.00" y="134.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#53677c">zig: 0.17.0</text><text x="32.00" y="153.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#53677c">rust: cargo 1.96.1 (356927216 2026-06-26)</text><text x="32.00" y="172.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#53677c">c: MSVC 14.51.36231</text><text x="32.00" y="221.00" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#16283c">tokenizer</text><text x="32.00" y="246.00" font-family="Arial,Helvetica,sans-serif" font-size
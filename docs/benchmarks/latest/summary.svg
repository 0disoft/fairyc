<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="437" viewBox="0 0 1120 437" role="img" aria-labelledby="chart-efdb0ad3-title chart-efdb0ad3-desc"><title id="chart-efdb0ad3-title">Build footprint</title><desc id="chart-efdb0ad3-desc">Build footprints sum logical file lengths after each command in disjoint output/cache roots. Toolchain installations are inventoried separately; transient peak disk usage is not measured. Cold means empty experiment caches, not OS page caches. Timings include driver startup. C directly rebuilds all sources, including no-op. Development profiles have different debug/safety defaults.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="32.00" y="42.00" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#16283c">Build footprint</text><text x="32.00" y="69.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53677c">2026-10-20 | windows/amd64 | ec446d2dfd | 1 run(s)</text><text x="32.00" y="99.00" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53677c">many-modules | 20 source edits | development profiles</text><text x="32.00" y="151.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16283c">Fairy C</text><rect x="250.00" y="132.00" width="590.00" height="26.00" fill="#e9eef3"/><rect x="250.00" y="132.00" width="0.27" height="26.00" fill="#087f8c"/><rect x="250.27" y="132.00" width="0.02" height="26.00" fill="#2877c7"/><text x="860.00" y="151.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16283c">163.8 KiB</text><text x="32.00" y="199.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16283c">Zig</text><rect x="250.00" y="180.00" width="590.00" height="26.00" fill="#e9eef3"/><rect x="250.00" y="180.00" width="434.76" height="26.00" fill="#087f8c"/><rect x="684.76" y="180.00" width="155.24" height="26.00" fill="#2877c7"/><text x="860.00" y="199.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16283c">323.29 MiB
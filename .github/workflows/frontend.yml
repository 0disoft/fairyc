name: Frontend

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full lowercase commit SHA: run only Windows native smoke; empty runs all checks'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # The repository-owned C files are embedded compiler inputs, not cgo sources.
  CGO_ENABLED: "0"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || 'full' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_tests: ${{ steps.paths.outputs.run_tests }}
    steps:
      - name: Check out history for the complete push or PR diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test CI path routing
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Decide whether compiler checks are needed
        id: paths
        run: python3 .github/scripts/ci_changes.py >> "$GITHUB_OUTPUT"

  validate:
    name: Go frontend (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') && (needs.changes.result != 'success' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: ${{ matrix.os }}
    # Windows core includes native compile/run regressions as well as Go tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test
        if: runner.os == 'Linux'
        shell: bash
        run: go test -mod=readonly -count=1 -json ./... | python3 -B .github/scripts/linux_phase2_evidence.py
      - name: Test Windows core without separate native or cost proofs
        if: runner.os == 'Windows'
        run: |
          $skip = @(
            '^TestWindowsFairy(Lexer|Parser[A-Z])',
            '^TestTokenIndexNominalTotalMSVC$',
            '^TestTokenIndexNominalCostMSVC$',
            '^TestTokenIndexStructCostMSVC$',
            '^TestStableGenericWorkspaceGrowthMSVC$',
            '^TestResultBranchReviewIsOkNativeSizes$',
            '^TestScannerFieldShorthandNativeSizes$',
            '^TestArgumentLabelsParserNativeSizes$',
            '^TestByteViewRealLexerWorkloadComparison$'
          ) -join '|'
          go test -mod=readonly -count=1 -timeout 15m -v -skip $skip ./...
      - name: Race-test contract-state concurrency
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race -mod=readonly -count=1 ./internal/contractstate

  windows-native:
    name: Windows native target smoke
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') || needs.changes.result != 'success' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: windows-latest
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || '' }}
    # Keep native proof independent of the full Go suite's timeout budget.
    timeout-minutes: 10
    steps:
      - name: Validate candidate SHA before checkout
        id: candidate-input
        if: env.CANDIDATE_SHA != ''
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:CANDIDATE_SHA -ceq ('0' * 40)) {
            throw 'candidate_sha must be a full lowercase, nonzero 40-character commit SHA'
          }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA || github.sha }}
      - name: Verify checked-out revision
        id: revision
        run: |
          $actual = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out source revision' }
          $actual = $actual.Trim()
          if ($env:CANDIDATE_SHA -and $actual -cne $env:CANDIDATE_SHA) {
            throw "Checked-out revision $actual differs from requested candidate $env:CANDIDATE_SHA"
          }
          "source_sha=$actual" >> $env:GITHUB_OUTPUT
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Windows native target smoke
        id: smoke
        run: go run -mod=readonly ./tools/dev/fairyc-windows-host-smoke
      - name: Record Windows native verification identity
        id: receipt
        if: ${{ always() && steps.revision.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          $receipt = [ordered]@{
            schema = 'fairyc.windows-native-ci/v1'
            sourceRevision = $env:SOURCE_SHA
            requestedRevision = $env:CANDIDATE_SHA
            workflowRevision = $env:WORKFLOW_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            smokeOutcome = $env:SMOKE_OUTCOME
            passed = $env:SMOKE_OUTCOME -ceq 'success'
          }
          $json = $receipt | ConvertTo-Json
          Write-Output $json
          '### Windows native verification' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          $json >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

  windows-parser:
    name: Windows candidate proof (${{ matrix.group }})
    needs: changes
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') && (needs.changes.result != 'success' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: windows-latest
    # The lexer proof approaches ten minutes before checkout/setup/cleanup.
    timeout-minutes: ${{ matrix.group == 'lexer' && 12 || 10 }}
    # All groups remain required by native-c. Separate runners avoid shared
    # native-build state; verbose output preserves the active test on timeout.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lexer
            tests: '^TestWindowsFairyLexer'
          - group: parser-a-h
            tests: '^TestWindowsFairyParser[A-H]'
          - group: parser-i-r
            tests: '^TestWindowsFairyParser[I-R]'
          - group: parser-s-z
            tests: '^TestWindowsFairyParser[S-Z]'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run required Fairy native proof group
        run: go test -mod=readonly -count=1 -v -run '${{ matrix.tests }}' ./internal/cli

  native-c:
    name: C differential (Linux)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.candidate_sha != '') }}
    needs: [validate, windows-native, windows-parser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Provision reference Linux toolchain
        run: bash .github/scripts/setup_linux_toolchain.sh "$RUNNER_TEMP/fairyc-toolchain/bin"
      - name: Run C differential, sanitizer, layout, ABI, and product build checks
        run: go run -mod=readonly ./tools/dev/fairyc-native-fixtures spec/fixtures/c-emission/manifest-v0.json

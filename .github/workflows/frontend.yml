name: Frontend

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

env:
  # The repository-owned C files are embedded compiler inputs, not cgo sources.
  CGO_ENABLED: "0"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -count=1 ./...
      - name: Run Windows native target smoke
        if: runner.os == 'Windows'
        run: go run -mod=readonly ./cmd/fairyc-windows-host-smoke

  native-c:
    name: C differential (Linux)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run C differential, sanitizer, layout, ABI, and product build checks
        run: go run -mod=readonly ./cmd/fairyc-native-fixtures spec/fixtures/c-emission/manifest-v0.json

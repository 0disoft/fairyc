name: Measurements

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

concurrency:
  group: measurements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-host:
    name: Windows host measurements
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run correctness smoke with measurements
        run: go run -mod=readonly ./tools/dev/fairyc-windows-host-smoke --with-measurements

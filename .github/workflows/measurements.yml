name: Measurements

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

concurrency:
  group: measurements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-host:
    name: Windows host measurements
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run correctness smoke with measurements
        run: go run -mod=readonly ./cmd/fairyc-windows-host-smoke --with-measurements
